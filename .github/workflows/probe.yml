name: probe-http2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "httpx[http2]" requests

      - name: Compare HTTP/1.1 and HTTP/2 against Instagram
        env:
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
        run: python -u probe_http2.py
