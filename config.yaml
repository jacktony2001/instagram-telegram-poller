# هر پیجی که می‌خواهی دنبال کنی، بدون @ بنویس.
accounts:
  - wwe
  - natgeo

# api = فیدِ خودِ اکانت خواننده از API خصوصی اینستاگرام + استوری‌ها. تنها روشی که از سرور گیت‌هاب جواب می‌دهد.
# profile = روش قدیمی با instaloader (تایم‌لاین تک‌تک پیج‌ها). از سرور گیت‌هاب با ۴۲۹ رد می‌شود، فقط پشتیبان است.
# feed = instaloader از فید. فعلاً خالی برمی‌گردد.
# auto = اول api، اگر نشد profile
mode: auto

# در روش api استوری‌ها هم می‌آیند. false فقط روی روش profile اثر دارد.
stories: true

# فیدِ اینستاگرام ترتیب زمانی ندارد و پست ماه‌های قبل را هم نشان می‌دهد.
# هر چه قدیمی‌تر از این ساعت باشد رد می‌شود تا تاریخچه‌ی قدیمی وارد تلگرام نیاید.
max_post_age_hours: 24

# پروکسی رایگان در تست واقعی نجات نداد (۸ آدرس، همه مرده یا ۴۲۹). روی false بگذار مگر دلیل داشته باشی.
proxies: false

# اگر proxies را true گذاشتی، لیست‌های جایگزین را این‌جا بنویس.
# proxy_urls:
#   - https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/protocols/http/data.txt
