# Instagram → Telegram poller configuration.
#
# WARNING — read before you run this.
# The bot reads Instagram through the private API the official mobile app uses, which is
# not a public, permitted interface. It breaches Instagram's Terms of Service, and the
# account behind IG_SESSION_B64 can be rate-limited, checkpointed or banned for it. Use a
# throwaway or an account you own; never someone else's session. There is no warranty.
# See the "Warnings" section of README.md for the details.

# Every page you want to follow, written without @.
accounts:
  - wwe
  - natgeo

# api = the reading account's own feed from Instagram's private API, plus stories.
#       The only route that answers from a GitHub server. The reading account must
#       already follow every page above, because that is all the feed contains.
# profile = the old instaloader route (each timeline one by one). Rejected with 429
#           from GitHub servers; kept only as a fallback.
# feed = instaloader through the feed. Currently returns nothing useful.
# auto = try api first, then profile.
mode: auto

# In api mode stories arrive as well. false only affects profile mode.
stories: true

# Instagram's feed is ranked, not chronological, and it serves months-old posts too.
# Anything older than this many hours is skipped, so the first run does not flood
# Telegram with the page's back catalogue.
max_post_age_hours: 24

# A story lives for a day and the bot sees that whole day on every run, so without
# these two limits a busy page would send twenty-hour-old stories in bulk.
max_story_age_hours: 4
max_stories_per_run: 6

# Free proxies saved nothing in real testing (8 addresses: dead or the same 429),
# because Instagram identifies you by the session cookie, not only the IP.
# Leave this false unless you have a reason.
proxies: false

# If you set proxies to true, list your own proxy sources here.
# proxy_urls:
#   - https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/protocols/http/data.txt
