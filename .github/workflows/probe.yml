name: probe-api

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi

      - name: Which route still carries post data
        env:
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
        run: python -u probe_web.py
