name: probe-mirrors

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi

      - name: Ask public Instagram mirrors for the same data
        run: python -u probe_mirrors.py
