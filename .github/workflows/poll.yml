name: poll-instagram

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: poll-instagram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send new media to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
          IG_USER: ${{ secrets.IG_USER }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: poll.yml
          MAX_NEW_PER_RUN: ${{ vars.MAX_NEW_PER_RUN }}
          PROXY_TRIES: ${{ vars.PROXY_TRIES }}
        run: python bot.py

      - name: Commit seen-media state
        if: always()
        run: |
          git config user.name "instagram-poller[bot]"
          git config user.email "bot@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
